<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mustang GT3 — 3D Drive</title>
<style>html,body{margin:0;width:100%;height:100%;overflow-x:hidden;background:#050608;color:#fff;font-family:Arial,sans-serif}#webgl{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#050608}#loading .box{text-align:center}#loading b{font-size:12px;letter-spacing:.3em;text-transform:uppercase}#loading p{font-size:11px;opacity:.5;margin-top:12px}.hero{position:fixed;z-index:2;top:27%;left:7vw;pointer-events:none}.hero small{letter-spacing:.3em;opacity:.5}.hero h1{font-size:clamp(60px,9vw,130px);line-height:.82;margin:15px 0;letter-spacing:-.06em}.hero p{max-width:430px;color:#aaa;line-height:1.5;font-size:14px}.scroll{position:fixed;z-index:2;bottom:25px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.25em;opacity:.5}</style>
</head><body>
<div id="webgl"></div><div id="loading"><div class="box"><b>Loading Mustang GT3</b><p id="status">Starting 3D engine…</p></div></div>
<div class="hero"><small>FORD PERFORMANCE / GT3</small><h1>BUILT<br>TO MOVE.</h1><p>Scroll through the cinematic 3D experience while the Mustang drives continuously.</p></div><div class="scroll">SCROLL TO DRIVE</div><div style="height:500vh"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.178.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050608);scene.fog=new THREE.FogExp2(0x050608,.012);const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.03,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.getElementById('webgl').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbad0ff,0x111116,2.2));const key=new THREE.DirectionalLight(0xffffff,5);key.position.set(7,10,6);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x4e7fff,4);rim.position.set(-8,4,-10);scene.add(rim);const road=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x08090c,roughness:.85}));road.rotation.x=-Math.PI/2;road.position.y=-1.2;road.receiveShadow=true;scene.add(road);
const rig=new THREE.Group();scene.add(rig);let car=null,scroll=0,smooth=0,t0=performance.now();
new THREE.GLTFLoader().load('model/scene.gltf',g=>{car=g.scene;rig.add(car);const box=new THREE.Box3().setFromObject(car),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());car.position.sub(center);car.scale.setScalar(5.8/Math.max(size.x,size.y,size.z));car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});document.getElementById('loading').remove();requestAnimationFrame(loop)},x=>{if(x.total)document.getElementById('status').textContent='Loading model '+Math.round(x.loaded/x.total*100)+'%'},e=>document.getElementById('status').textContent='Model failed to load');
addEventListener('scroll',()=>{const max=document.documentElement.scrollHeight-innerHeight;scroll=max?Math.max(0,Math.min(1,scrollY/max)):0},{passive:true});
function loop(t){requestAnimationFrame(loop);const elapsed=(t-t0)/1000;smooth+=(scroll-smooth)*.075;const p=smooth*smooth*(3-2*smooth);rig.position.z=Math.sin(elapsed*.45)*.45;rig.position.x=Math.sin(elapsed*.65)*.18;rig.rotation.y=Math.sin(elapsed*.4)*.025;car.position.y=Math.sin(elapsed*18)*.008;car.rotation.z=Math.sin(elapsed*8)*.003;const a=.55+p*(-2.75),r=9.2-p*4;camera.position.x=Math.cos(a)*r;camera.position.z=Math.sin(a)*r+1.2;camera.position.y=3-p*1.9+Math.sin(p*Math.PI)*.6;if(p>.72){const q=(p-.72)/.28;camera.position.z=THREE.MathUtils.lerp(camera.position.z,-2.2,q);camera.position.x=THREE.MathUtils.lerp(camera.position.x,1,q);camera.position.y=THREE.MathUtils.lerp(camera.position.y,.55,q)}camera.lookAt(0,0,0);renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
